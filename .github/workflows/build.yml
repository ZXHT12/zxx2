name: Build ZXHT Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: unzip -q zxht-client-source.zip
      - run: cd zxht-client && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: zxht-client-jar
          path: zxht-client/build/libs/*.jar
          
